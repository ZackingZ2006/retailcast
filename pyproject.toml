[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailcast-portfolio"
version = "1.0.0"
description = "Auditable 28-day retail sales forecasting with temporal validation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "openpyxl>=3.1,<4", "scikit-learn>=1.5,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.9,<4", "plotly>=5.24,<8", "streamlit>=1.50,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
retailcast = "retailcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retailcast = ["dashboard_template.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
